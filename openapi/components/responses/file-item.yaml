description: A file
content:
  application/json:
    schema:
      type: object
      properties:
        fileName:
          type: string
          examples:
            - School-Events-PNG-2
        title:
          type: string
          examples:
            - School Events
        description:
          type: string
          examples:
            - |
              Banner image for 2022 school events
        hidden:
          type: boolean
          examples:
            - false
        mimeType:
          type: string
          examples:
            - image/png
        filesize:
          type: integer
          description: file size in bytes
          examples:
            - 117407