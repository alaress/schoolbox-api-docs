get:
  operationId: commsNewsSaveForLater.getList
  tags: [news]
  summary: Get list of saved articles
  description: |
    Retrieve the IDs of all saved news articles for the authenticated user.

    This endpoint requires one of the following scopes when authorized using a
    bearer token:
    - https://schoolbox.education/scope/news
    - https://schoolbox.education/scope/news:readonly
  security:
    - session: []
    - bearerAuth:
        - https://schoolbox.education/scope/news
    - bearerAuth:
        - https://schoolbox.education/scope/news:readonly
  responses:
    '200':
      description: The IDs of all saved news articles for the authenticated user.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/id.yaml
    default:
      $ref: ../components/responses/problem.yaml
