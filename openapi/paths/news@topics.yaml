get:
  operationId: commsNews.getTopics
  tags: [news]
  summary: Get available news topics
  description: |
    Retrieve all available news topics, which may be attached to a news article.

    This endpoint requires one of the following scopes when authorized using a
    bearer token:
    - https://schoolbox.education/scope/news
    - https://schoolbox.education/scope/news:readonly
  security:
    - session: []
    - bearerAuth:
        - https://schoolbox.education/scope/news
    - bearerAuth:
        - https://schoolbox.education/scope/news:readonly
  responses:
    '200':
      description: All available news topics.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/news/topic.yaml
    default:
      $ref: ../components/responses/problem.yaml
