title: Evidence
type: object
properties:
  discriminator:
    type: string
    description: Identifies this item as a learning moment.
    enum:
      - moment
  object:
    $ref: ./evidenceItem.yaml
  date:
    type: string
    format: date-time
    description: |
      The date as a RFC3339 string.
    examples:
      - 2022-08-30T10:09:09+10:00
required:
  - discriminator
