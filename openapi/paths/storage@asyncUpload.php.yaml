post:
  operationId: storageAsyncUpload
  tags: [file]
  summary: Upload a file
  description: |
    Upload a file to Schoolbox's internal file storage system.

    This file may then be referenced directly, or provided as an argument to
    another place which accepts file uploads.

    This endpoint requires the following scope when authorized using a bearer
    token:
    - https://schoolbox.education/scope/upload
  security:
    - session: []
    - bearerAuth:
        - https://schoolbox.education/scope/upload
  responses:
    '401':
      $ref: ../components/responses/fileUpload-result.yaml
      description: |
        The request's bearer token was invalid, or the request was not
        authenticated at all.
    '403':
      $ref: ../components/responses/fileUpload-result.yaml
      description: |
        The request was authorized with a bearer token which does not have the
        required scope.
    '500':
      $ref: ../components/responses/fileUpload-result.yaml
      description: |
        An unexpected error occurred whilst authorizing the request.
    default:
      $ref: ../components/responses/fileUpload-result.yaml
  requestBody:
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            upload:
              type: string
              format: binary
              description: |
                The file being uploaded.
          required:
            - upload
  parameters:
    - name: expiryDate
      in: query
      description: |
        An optional date at which the uploaded file is considered to expire: after
        this date, the file will be subject to garbage collection.

        If not provided: the uploaded file will never expire.
      schema:
        type: string
        format: date-time
