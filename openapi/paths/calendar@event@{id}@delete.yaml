parameters:
  - $ref: ../components/parameters/id.yaml
post:
  operationId: calendarEvent.postDelete
  tags: [calendar]
  summary: Delete a calendar event
  description: |
    Deletes a calendar event

    This endpoint requires the following scope when authorized using a bearer
    token:
    - https://schoolbox.education/scope/calendar
  security:
    - session: []
    - bearerAuth:
        - https://schoolbox.education/scope/calendar
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            efficacy:
              type: string
              enum:
                - self
                - series
              examples:
                - self
              description: |
                Either 'self' (to delete only the one event), or 'series' (to delete all events in the series).
  responses:
    '204':
      description: |
        Empty body
    default:
      $ref: ../components/responses/problem.yaml
