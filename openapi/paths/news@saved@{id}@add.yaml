post:
  operationId: commsNewsSaveForLater.postAdd
  tags: [news]
  summary: Save an article for later
  description: |
    Save an article for the authenticated user.

    This article will then be returned by the
    [Get list of saved articles](#get-/news/saved/)
    endpoint.

    This endpoint requires the following scope when authorized using a bearer
    token:
    - https://schoolbox.education/scope/news
  security:
    - session: []
    - bearerAuth:
        - https://schoolbox.education/scope/news
  responses:
    '200':
      description: |
        Currently always empty for this endpoint.
      content:
        application/json:
          schema:
            type: array
          example: []
    default:
      $ref: ../components/responses/problem.yaml
  parameters:
    - $ref: ../components/parameters/id.yaml
