description: |
  Calendar event information.
content:
  application/x-www-form-urlencoded:
    schema:
      type: object
      properties:
        id:
          $ref: ../schemas/id.yaml
        userId:
          $ref: ../schemas/id.yaml
        authorId:
          $ref: ../schemas/id.yaml
        allDay:
          type: integer
          examples:
            - 0
          description: Whether the event is an all day event.
        efficacy:
          type: string
          enum:
            - self
            - series
          examples:
            - "self"
          description: \
            Whether the requested change should apply only to the event with the given 'id', or to all events in the
            series of which event 'id' is a member.
        title:
          type: string
          examples:
            - "Senior School Parent Teacher Interviews"
          description: Title of event.
        startDate:
          type: string
          examples:
            - "09\/03\/2024 4:00pm"
          description: Start date of event.
        endDate:
          type: string
          examples:
            - "09\/03\/2024 8:00pm"
          description: End date of event.
        repeat:
          type: string
          examples:
            - "weekly"
          enum: ["", "daily", "weekly", "fortnightly", "monthly", "yearly"]
          description: Blank for single event.
        repeat_until:
          type: string
          examples:
            - "09\/03\/2025"
          description: "Date event repeats until."
        type:
          type: integer
          examples:
            - 5
          description: Event type ID (references lu_event_type database table.
        location:
          type: string
          examples:
            - "Meeting room 1"
          description: Location name or description.
        detail:
          type: string
          examples:
            - "Meeting to discuss things"
          description: More details about event.
        publishDate:
          type: string
          examples:
            - "04\/02\/2016 12:00am"
          description: Date at which event becomes public.
        level:
          type: integer
          examples:
            - 2
          description: Event level ID.  1 for Personal, 2 for Group, 3 for Campus.
          enum: [1, 2, 3]
        roles:
          type: array
          description: Array of role objects.
          items:
            type: object
            properties:
              id:
                $ref: ./../schemas/id.yaml
        campuses:
          type: array
          description: Array of campus object stubs.
          examples:
            - [{"id":123}, {"id":456}]
          items:
            type: object
            properties:
              id:
                $ref: ./../schemas/id.yaml
        folders:
          type: array
          description: Array of folder object stubs.
          examples:
            - [{"id":123}, {"id":456}]
          items:
            type: object
            properties:
              id:
                $ref: ./../schemas/id.yaml
        attendance:
          type: integer
          examples:
            - 0
          description: Whether attendance is enabled.
        guests:
          type: array
          description: Array of user object stubs.
          examples:
            - [{"id":123}, {"id":456}]
          items:
            type: object
            properties:
              id:
                $ref: ./../schemas/id.yaml
        maxAttendees:
          type: integer
          examples:
            - 5
          description: The maximum number of guests who may attend this event.
        showAttendees:
          type: integer
          examples:
            - 1
          description: Whether the list of attendees will show visible to guests.