get:
  operationId: apiSearchGet
  tags: [search]
  summary: Search for content
  description: |
    Search for content

    This endpoint requires the following scope when authorized using a bearer
    token:
    - https://schoolbox.education/scope/search
  security:
    - session: []
    - bearerAuth:
        - https://schoolbox.education/scope/search
  responses:
    '200':
      $ref: ../components/responses/search/result-list.yaml
    default:
      $ref: ../components/responses/problem.yaml
  parameters:
    - $ref: ../components/parameters/search/keyword.yaml
    - $ref: ../components/parameters/search/filter.yaml
    - $ref: ../components/parameters/cursor.yaml
    - $ref: ../components/parameters/limit.yaml
