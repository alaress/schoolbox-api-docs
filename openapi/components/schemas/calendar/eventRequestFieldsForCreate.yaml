required:
  - allDay
  - title
  - startDate
  - endDate
  - publishDate
  - type
  - level
properties:
  user:
    type: object
    description:
      An object stub for specifying a user.  This specifies the owner of the event.
      When an event is created, if this is not supplied the logged-in user will
      become the owner.  Note the owner may not be changed after event creation.
    properties:
      id:
        $ref: ../../schemas/id.yaml
  resources:
    type: array
    description: |
      Array of Resource Booking item object stubs to book against the new event.
      Resource Booking must be enabled, and the authenticated user must have
      permission to book each supplied resource.
    example: [{"id": 42}, {"id": 57}]
    items:
      type: object
      required:
        - id
      properties:
        id:
          $ref: ../../schemas/id.yaml
allOf:
  - type: object
  - $ref: eventRequestFieldsForModify.yaml
