post:
  operationId: learningMomentEvidence.postMomentForUsers
  tags: [learningMoment]
  summary: Create a learning moment for users
  deprecated: true
  description: |
    Share a learning moment (Deprecated).
    Use one of the 'Draft/Publish/Submit a learning moment for multiple users' POST endpoints instead.

    This endpoint requires the following scope when authorized using a bearer
    token:
    - https://schoolbox.education/scope/learningMoment
  security:
    - session: []
    - bearerAuth:
        - https://schoolbox.education/scope/learningMoment
  responses:
    '201':
      description: Successfully created a learning moment.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/evidenceItem.yaml
    default:
      $ref: ../components/responses/problem.yaml
  requestBody:
    $ref: ../components/requestBodies/evidence-item.yaml
  parameters:
    - $ref: ../components/parameters/id.yaml
