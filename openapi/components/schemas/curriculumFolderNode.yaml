title: Folder curriculum node
description: |
  A curriculum node as returned by the folder curriculum endpoints.
type: object
readOnly: true
properties:
  id:
    $ref: ./id.yaml
  name:
    type: [string, 'null']
    examples: [Self-awareness]
  code:
    type: string
    description: The node's curriculum code. An empty string if it has none.
    examples: [GCPSC-SEA]
  description:
    type: string
  reference:
    type: [string, 'null']
  enabled:
    type: boolean
    description: |
      Whether the node is enabled. In tree format, disabled nodes are only
      included when they are directly associated with the folder.
  breadcrumb:
    type: string
    description: The names of the node's ancestors and itself, separated by ` > `.
    examples: ['Traits > Self-awareness']
  uuid:
    type: [string, 'null']
    format: uuid
    description: A stable, unique identifier for the node.
  children:
    type: array
    description: |
      The node's child nodes when `returnFormat` is `tree`. Otherwise
      this may be empty.
    items:
      $ref: ./curriculumFolderNode.yaml
