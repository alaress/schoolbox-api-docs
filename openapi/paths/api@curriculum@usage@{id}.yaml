get:
  operationId: curriculumApiUsage.getNodeUsage
  tags: [curriculum]
  summary: Get curriculum node usage
  description: |
    Get curriculum node usage

    This endpoint requires one of the following scopes when authorized using a
    bearer token:
    - https://schoolbox.education/scope/curriculum
    - https://schoolbox.education/scope/curriculum:readonly
  security:
    - session: []
    - bearerAuth:
        - https://schoolbox.education/scope/curriculum
    - bearerAuth:
        - https://schoolbox.education/scope/curriculum:readonly
  responses:
    '200':
      $ref: ../components/responses/curriculumNodeUsage-list.yaml
    default:
      $ref: ../components/responses/problem.yaml

parameters:
  - $ref: ../components/parameters/id.yaml
  - $ref: ../components/parameters/cursor.yaml
  - $ref: ../components/parameters/limit.yaml
