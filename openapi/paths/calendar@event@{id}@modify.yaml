parameters:
  - $ref: ../components/parameters/id.yaml
post:
  operationId: calendarEvent.postModify
  tags: [calendar]
  summary: Modify a calendar event
  description: |
    Modifies a calendar event

    This endpoint requires the following scope when authorized using a bearer
    token:
    - https://schoolbox.education/scope/calendar
  security:
    - session: []
    - bearerAuth:
        - https://schoolbox.education/scope/calendar
  requestBody:
    description: |
      The event including desired modifications
    content:
      application/json:
        schema:
          $ref: ../components/schemas/calendar/eventRequestFieldsForModify.yaml
  responses:
    '200':
      description: |
        The modified event
      content:
        application/json:
          schema:
            $ref: ../components/schemas/calendar/eventResponseFields.yaml
    default:
      $ref: ../components/responses/problem.yaml
