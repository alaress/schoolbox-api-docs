title: A badgeAward item
description: A Badge Award item
readOnly: true
type: object
properties:
  id:
    $ref: ./id.yaml
  badge:
    $ref: ./badgeItem.yaml
  status:
    type: string
    enum:
      - goal
      - achievement
    examples:
      - goal
  reason:
    type: string
    examples:
      - I saw it with my own eyes!
  isGoal:
    type: boolean
    examples:
      - true
  award:
    $ref: ./badgeAwardItem.yaml
  recipient:
    type: object
    properties:
      id:
        $ref: ./id.yaml
      externalId:
        $ref: ./externalId.yaml
      title:
        type: [string, 'null']
        description: The user's title (Mr., Ms., etc.).
        examples:
          - Ms
      firstName:
        type: [string, 'null']
        description: |
          The user's first name.

          Schoolbox doesn't distinguish between a person's actual first name
          and any other names, and in any case is not the definitive source of
          naming information; therefore in practice this will usually be the
          user's given name.
        examples:
          - Rebecca

      lastName:
        type: [string, 'null']
        description: The user's surname.
        examples:
          - White
      _links:
        type: object
        properties:
          profile:
            type: string
            examples:
              - /search/user/2
          avatar:
            type: string
            examples:
              - /portrait.php?id=2&size=square64
      isDeleted:
        type: boolean
        examples:
          - false
  awardedBy:
    type: object
    properties:
      id:
        $ref: ./id.yaml
      externalId:
        $ref: ./externalId.yaml
      title:
        type: [string, 'null']
        description: The user's title (Mr., Ms., etc.).
        examples:
          - Ms
      firstName:
        type: [string, 'null']
        description: |
          The user's first name.

          Schoolbox doesn't distinguish between a person's actual first name
          and any other names, and in any case is not the definitive source of
          naming information; therefore in practice this will usually be the
          user's given name.
        examples:
          - Rebecca

      lastName:
        type: [string, 'null']
        description: The user's surname.
        examples:
          - White
      _links:
        type: object
        properties:
          profile:
            type: string
            examples:
              - /search/user/2
          avatar:
            type: string
            examples:
              - /portrait.php?id=2&size=square64
      isDeleted:
        type: boolean
        examples:
          - false
  awardedAt:
    type: string
    format: date-time
    description: |
      The date as a RFC3339 string.
    examples:
      - 2022-08-27T12:49:11+10:00
  reasonedBy:
    $ref: ./userShort.yaml
  reasonedAt:
    type: [string, 'null']
    format: date-time
    description: |
      The date as a RFC3339 string.
    examples:
      - 2022-08-27T12:49:11+10:00
  expiresAt:
    type: [string, 'null']
    format: date-time
    description: |
      The date as a RFC3339 string.
    examples:
      - null
  viewedOn:
    type: [string, 'null']
    format: date-time
    description: |
      The date as a RFC3339 string.
    examples:
      - null
  _links:
    type: object
    properties:
      achievementWithdraw:
        type: string
        examples:
          - /learning/badge/award/10/achievement/withdraw
      goalWithdraw:
        type: string
        examples:
          - /learning/badge/award/10/goal/withdraw
      goalAward:
        type: string
        examples:
          - /learning/badge/award/10/achievement
      awardUpdate:
        type: string
        examples:
          - /learning/badge/award/8/update