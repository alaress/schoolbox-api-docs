get:
  operationId: getDifferentiationProfile
  tags: [differentiation]
  summary: Get a differentiation profile
  description: |
    Retrieve the differentiation profile for a specific student.

    This endpoint requires one of the following scopes when authorized using a
    bearer token:
    - https://schoolbox.education/scope/differentiation
    - https://schoolbox.education/scope/differentiation:readonly
  security:
    - session: []
    - bearerAuth:
        - https://schoolbox.education/scope/differentiation
    - bearerAuth:
        - https://schoolbox.education/scope/differentiation:readonly
  responses:
    '200':
      $ref: ../components/responses/differentiationProfile.yaml
    default:
      $ref: ../components/responses/problem.yaml

parameters:
  - $ref: ../components/parameters/id.yaml

post:
  operationId: createDifferentiationProfile
  tags: [differentiation]
  summary: Create a differentiation profile
  description: |
    Create a new differentiation profile.

    This endpoint requires the following scope when authorized using a bearer
    token:
    - https://schoolbox.education/scope/differentiation
  security:
    - session: []
    - bearerAuth:
        - https://schoolbox.education/scope/differentiation
  requestBody:
    $ref: ../components/requestBodies/differentiation.yaml
  responses:
    '201':
      $ref: ../components/responses/differentiationProfile.yaml
    default:
      $ref: ../components/responses/problem.yaml

put:
  operationId: updateDifferentiationProfile
  tags: [differentiation]
  summary: Update a differentiation profile
  description: |
    Update an existing differentiation profile.

    This endpoint requires the following scope when authorized using a bearer
    token:
    - https://schoolbox.education/scope/differentiation
  security:
    - session: []
    - bearerAuth:
        - https://schoolbox.education/scope/differentiation
  requestBody:
    $ref: ../components/requestBodies/differentiation.yaml
  responses:
    '200':
      $ref: ../components/responses/differentiationProfile.yaml
    default:
      $ref: ../components/responses/problem.yaml