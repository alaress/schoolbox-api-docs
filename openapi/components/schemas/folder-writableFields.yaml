title: Writable folder fields
description: |
  The folder settings which can be written.

  Codes and year levels can only be set by superusers and users with the CMS
  Moderator service permission at Full level: for other users they are
  ignored. The recursive settings are only applied for superusers.
type: object
properties:
  name:
    type: string
    minLength: 1
    examples: [Year 7 Science]
  inherit:
    type: boolean
    description: |
      Whether the folder inherits its permissions from its parent. A folder
      which inherits has no class codes or role permissions of its own.

      **Warning:** setting `inherit` to `true` deletes the folder's role
      permissions. Setting it back to `false` doesn't restore them: send
      `rolePermissions` again.

      A folder with class codes can't inherit permissions: the request is
      refused with a 400 response. Remove the codes first, by sending an empty
      `codes` list, then set `inherit`.
  templateId:
    type: [integer, 'null']
    format: int32
    minimum: 1
    description: |
      The homepage template to give the folder, or `null` for no homepage.

      If it isn't sent, a new folder has no homepage and an existing folder
      keeps its homepage.

      **Warning:** sending `templateId` for an existing folder resets its
      homepage to the template, replacing the page's content, even when the
      template is the one it already has. Sending `null` removes the homepage.
  colour:
    type: [string, 'null']
    pattern: '^#?[0-9A-Fa-f]{6}$'
    examples: ['#1F6F5C']
  coverImage:
    type: [string, 'null']
    description: |
      The cover image, as a file reference such as `store:<hash>`: see
      [Upload a file](#operation/storageAsyncUpload).
    examples: ['store:1f8f836cce05750ac98302c74d4081f99fdd443f']
  codes:
    type: array
    description: The folder's class codes. Ignored when the folder inherits permissions.
    items:
      type: string
      maxLength: 64
    examples: [[SEN/7SCI1]]
  yearLevelIds:
    type: array
    items:
      type: integer
      format: int32
      minimum: 1
  curriculumNodeIds:
    type: array
    description: Curriculum nodes to tag the folder with. Disabled nodes are left out.
    items:
      type: integer
      format: int32
      minimum: 1
  rolePermissions:
    type: array
    description: |
      Access by role. Roles which aren't listed keep their current access; on
      a new folder, they have no access. Ignored when the folder inherits
      permissions.

      **Note:** a user who isn't a superuser can create a folder which doesn't
      inherit and gives their own role no access. They then can't open it.
    items:
      type: object
      properties:
        roleId:
          type: integer
          format: int32
          minimum: 1
        access:
          type: string
          enum: [none, read, write]
      required: [roleId, access]
  recursivePermissions:
    type: boolean
    default: false
    writeOnly: true
    description: |
      Also apply `inherit` and `rolePermissions` to every subfolder. Superusers
      only.

      **Warning:** with `inherit` set to `true`, every subfolder inherits too,
      which deletes the subfolders' own role permissions and class codes.
      Subfolders with class codes are not checked first.
  recursiveYearLevels:
    type: boolean
    default: false
    writeOnly: true
    description: Also apply `yearLevelIds` to every subfolder. Superusers only.
  createGroup:
    type: boolean
    default: false
    writeOnly: true
    description: |
      Make the folder a group, with the user as its administrator. The folder
      must not inherit permissions, and the user's role must be allowed to own
      groups.

      Add members with [Add user to a group](#operation/userGroupMembershipPost),
      using the folder's `id` as the `groupId`.
