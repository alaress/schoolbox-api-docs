get:
  operationId: userGetTokenForSelf
  deprecated: true
  tags: [userToken]
  summary: Get an authentication token
  description: |
    Retrieve an authentication token for the user: deprecated in favour of the
    `POST` variant.

    This endpoint is intended so that in-browser API calls performed within
    a Schoolbox instance may be performed in a manner more in common with
    calls to a remote API.

    This endpoint will automatically assign scopes, depending on the security
    scheme used to authenticate the request:
    | Scheme | Scopes |
    |---|---|
    | `bearerAuth` | Any scopes which exist on the JWT, and are defined on this security scheme: if none exist, the request will be rejected |
    | `session` | The session scope `https://schoolbox.education/scope/session` |
  responses:
    '200':
      $ref: ../components/responses/userToken.yaml
    default:
      $ref: ../components/responses/problem.yaml

post:
  operationId: userCreateTokenForSelf
  tags: [userToken]
  summary: Create an authentication token
  description: |
    Create an authentication token for the user.

    This endpoint is intended so that in-browser API calls performed within
    a Schoolbox instance may be performed in a manner more in common with
    calls to a remote API.

    This endpoint will restrict the scopes which may be added to the new token,
    depending on the security scheme used to authenticate the request:
    | Scheme | Scopes |
    |---|---|
    | `bearerAuth` | Any scopes which exist on the JWT, and are defined on this security scheme |
    | `session` | Any scope defined on the `bearerAuth` security scheme |

    The allowed scopes may be further restricted based on the identified user's
    permissions.
  requestBody:
    $ref: ../components/requestBodies/userToken-create.yaml
  responses:
    '200':
      $ref: ../components/responses/userToken-created.yaml
    default:
      $ref: ../components/responses/problem.yaml
