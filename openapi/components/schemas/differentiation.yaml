title: A Differentiation Profile
description: A Differentiation Profile object
type: object
properties:
  id:
    $ref: ./id.yaml
  status:
    type: array
    readOnly: true
    description: Status flags for the differentiation profile
    items:
      type: string
      enum:
        - unpopulated
        - expired
        - out-of-date
    examples:
      - []
  student:
    type: object
    description: The student associated with the differentiation profile
    properties:
      id:
        type: integer
        examples:
          - 69
      fullName:
        type: string
        examples:
          - "Eden Reed"
      givenName:
        type: string
        examples:
          - "Eden"
      lastName:
        type: string
        examples:
          - "Reed"
      yearLevel:
        type: object
        properties:
          id:
            type: integer
            examples:
              - 4
          name:
            type: string
            examples:
              - "3"
      _links:
        type: object
        properties:
          profile:
            type: string
            examples:
              - "/search/user/69"
  adjustment_category:
    type: [array, 'null']
    description: Array of adjustment categories (if applicable)
    items:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    examples:
      - - id: 1
          name: "Physical"
        - id: 2
          name: "Cognitive"
  adjustment_level:
    type: [array, 'null']
    description: Array of adjustment levels (if applicable)
    items:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    examples:
      - - id: 1
          name: "Extensive"
  overview:
    type: [string, 'null']
    description: Overview of the differentiation profile (if applicable)
    examples:
      - null
  interests_strengths:
    type: [string, 'null']
    description: Interests and strengths (if applicable)
    examples:
      - null
  needs_challenges:
    type: [string, 'null']
    description: Needs and challenges (if applicable)
    examples:
      - null
  strategies_adjustments:
    type: [string, 'null']
    description: Strategies and adjustments (if applicable)
    examples:
      - null
  goals:
    type: [string, 'null']
    description: Goals for the student (if applicable)
    examples:
      - 'Goal 1: Improve reading comprehension.'
  _routes:
    type: object
    description: Related routes for the differentiation profile
    properties:
      linkedRecords:
        type: [string, 'null']
        examples:
          - "/differentiation-profiles/linkedRecords/69"
      create:
        type: [string, 'null']
        examples:
          - "/differentiation-profiles/create/69"
      edit:
        type: [string, 'null']
        examples:
          - "/differentiation-profiles/edit/69"
  created_at:
    $ref: ./dateTimeString.yaml
  created_by:
    type: string
    description: Who created the profile
    examples:
      - "Mr John Smith"
  updated_at:
    $ref: ./dateTimeString.yaml
  updated_by:
    type: string
    description: Who last updated the profile
    examples:
      - "Mr John Smith"
  deleted_at:
    title: Datetime
    type: [string, 'null']
    description: When the profile was deleted (if applicable). The date as a RFC3339 string.
    format: date-time
    examples:
      - null

required:
  - id
  - status
  - student