title: Pastoral severity
description: A severity that can be set on pastoral records.
readOnly: true
type: object
properties:
  id:
    $ref: ./id.yaml
  name:
    type: string
    examples:
      - Low
  colour:
    description: The colour of the severity's label.
    type: [string, 'null']
    examples:
      - rgba(77, 199, 235, 1.000)
  sequence:
    description: The order in which severities are listed.
    type: integer
required: [id, name, colour, sequence]
