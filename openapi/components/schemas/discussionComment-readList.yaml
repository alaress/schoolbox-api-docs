title: Comment list
description: A list of comments
readOnly: true
type: object
properties:
  data:
    type: array
    items:
      title: Comment
      description: Common fields for discussion comments.
      type: object
      properties:
        id:
          description: The ID of this comment.
          type: integer
        author:
          description: The author of this comment.
          type: object
          properties:
            id:
              description: The ID of this user.
              type: integer
            externalId:
              $ref: ./externalId.yaml
            title:
              description: The user's title (Mr., Ms., etc.).
              type: [string, 'null']
            firstname:
              description: The user's first name.
              type: [string, 'null']
            fullName:
              description: The user's full name.
              type: [string, 'null']
            givenName:
              description: The user's given name.
              type: [string, 'null']
            lastname:
              description: The user's last name.
              type: [string, 'null']
            preferredName:
              description: The user's preferred name.
              type: [string, 'null']
            _links:
              type: object
              properties:
                avatar:
                  type: object
                  properties:
                    auth:
                      type: [string, 'null']
                    href:
                      type: [string, 'null']
                      format: uri
                profile:
                  type: object
                  properties:
                    auth:
                      type: [string, 'null']
                    href:
                      type: [string, 'null']
                      format: uri
        content:
          type: string
        createdAt:
          $ref: ./dateTimeString.yaml
        updatedAt:
          $ref: ./dateTimeString.yaml
  metadata:
    $ref: ./listMetadata.yaml
