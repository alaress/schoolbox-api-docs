get:
  operationId: getThread
  tags: [discussion]
  summary: Get a thread
  description: |
    This endpoint requires one of the following scopes when authorized using a
    bearer token, depending on `contextType`:
    - `comms`:
      - https://schoolbox.education/scope/news.comment
      - https://schoolbox.education/scope/news.comment:readonly
    - `evidence`:
      - https://schoolbox.education/scope/learningMoment.comment
      - https://schoolbox.education/scope/learningMoment.comment:readonly
  security:
    - session: []
    - bearerAuth:
        - https://schoolbox.education/scope/news.comment
    - bearerAuth:
        - https://schoolbox.education/scope/news.comment:readonly
    - bearerAuth:
        - https://schoolbox.education/scope/learningMoment.comment
    - bearerAuth:
        - https://schoolbox.education/scope/learningMoment.comment:readonly
  responses:
    '200':
      $ref: ../components/responses/discussionThread-item.yaml
    default:
      $ref: ../components/responses/problem.yaml

parameters:
  - $ref: ../components/parameters/discussion-contextType.yaml
  - $ref: ../components/parameters/discussion-contextId.yaml
  - $ref: ../components/parameters/id.yaml
