title: A learning moment item
description: A learning moment item
readOnly: true
type: object
properties:
  id:
    $ref: ./id.yaml
  createdAt:
    type: string
    format: date-time
    description: |
      The date as a RFC3339 string.
    examples:
      - 2022-08-30T10:09:09+10:00
  updatedAt:
    type: string
    format: date-time
    description: |
      The date as a RFC3339 string.
    examples:
      - 2022-08-30T10:09:09+10:00
  body:
    type: string
    description: |
      The content of the Learning Moment
  creator:
    type: object
    properties:
      id:
        $ref: ./id.yaml
      externalId:
        $ref: ./externalId.yaml
      title:
        type: [string, 'null']
        description: The user's title (Mr., Ms., etc.).
        examples:
          - Ms
      firstName:
        type: [string, 'null']
        description: |
          The user's first name.

          Schoolbox doesn't distinguish between a person's actual first name
          and any other names, and in any case is not the definitive source of
          naming information; therefore in practice this will usually be the
          user's given name.
        examples:
          - Rebecca

      lastName:
        type: [string, 'null']
        description: The user's surname.
        examples:
          - White
      _links:
        type: object
        properties:
          profile:
            type: string
            examples:
              - /search/user/2
          avatar:
            type: string
            examples:
              - /portrait.php?id=2&size=square64
      isDeleted:
        type: boolean
        examples:
          - false
  recipient:
    type: object
    properties:
      id:
        $ref: ./id.yaml
      externalId:
        $ref: ./externalId.yaml
      title:
        type: [string, 'null']
        description: The user's title (Mr., Ms., etc.).
        examples:
          - Ms
      firstName:
        type: [string, 'null']
        description: |
          The user's first name.

          Schoolbox doesn't distinguish between a person's actual first name
          and any other names, and in any case is not the definitive source of
          naming information; therefore in practice this will usually be the
          user's given name.
        examples:
          - Rebecca

      lastName:
        type: [string, 'null']
        description: The user's surname.
        examples:
          - White
      _links:
        type: object
        properties:
          profile:
            type: string
            examples:
              - /search/user/2
          avatar:
            type: string
            examples:
              - /portrait.php?id=2&size=square64
      isDeleted:
        type: boolean
        examples:
          - false
  discussionThread:
    $ref: ./discussionThread-read.yaml
  filename:
    type: [string, 'null']
  storage:
    type: [object, 'null']
    properties:
      hash:
        type: [string, 'null']
        examples:
          - 966fb6fbd7bdf8c442fb421d816b1ff8a7d6a23c
      mime:
        type: [string, 'null']
        examples:
          - image/jpeg
      type:
        type: [string, 'null']
        examples:
          - image
      size:
        type: [integer, 'null']
        examples:
          - 3385989
      _links:
        type: [object, 'null']
        description: |
          Will contain one of the following depending on what file type is attached
        properties:
          icon:
            type: string
            examples:
              - /static/images/mime/application-image-jpg.svg
          image:
            type: string
            examples:
              - /storage/image.php?hash=966fb6fbd7bdf8c442fb421d816b1ff8a7d6a23c
          stream:
            type: string
          poster:
            type: string
          fetch:
            type: string
            examples:
              - /storage/fetch.php?hash=966fb6fbd7bdf8c442fb421d816b1ff8a7d6a23c
  curriculumNodes:
    type: [array, 'null']
    items:
      $ref: ./curriculumItem.yaml
  tags:
    type: [object, 'null']
    description: |
      System configurable in your Admin Lists Learning Moment area
    properties:
      id:
        type: integer
        description: the DB identifier of the Learning Moment Tags
        examples:
          - 1
      name:
        type: string
        description: the name of the Learning Moment type, may not be unique
        examples:
          - Class Work
  _links:
    type: object
    properties:
      createThread:
        type: string
        examples:
          - /discussion/evidence/7/threads
      delete:
        type: string
        examples:
          - /learning/evidence/7
      detail:
        type: string
        examples:
          - /learning/evidence/7
      modifyForm:
        type: string
        examples:
          - /learning/evidence/7/modify
      put:
        type: string
        examples:
          - /learning/evidence/7