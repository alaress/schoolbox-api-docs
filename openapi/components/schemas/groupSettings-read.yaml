title: Group settings (read)
readOnly: true
allOf:
  - $ref: ./groupSettings.yaml
  - type: object
    properties:
      new:
        type: integer
        description: |
          The `new` query parameter from the request, or `0` if it wasn't sent.
          Used by the Manage Group page.
        examples:
          - 0
      access:
        description: |
          How users join the group. Blank if the folder isn't a group.
        type: string
        enum:
          - private
          - moderated
          - free
          - ''
