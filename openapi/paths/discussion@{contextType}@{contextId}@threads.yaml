post:
  operationId: createThread
  tags: [discussion]
  summary: Create a thread
  description: |
    This endpoint requires the following scope when authorized using a bearer
    token, depending on `contextType`:
    - `comms`:
      - https://schoolbox.education/scope/news.comment
    - `evidence`:
      - https://schoolbox.education/scope/learningMoment.comment
  security:
    - session: []
    - bearerAuth:
        - https://schoolbox.education/scope/news.comment
    - bearerAuth:
        - https://schoolbox.education/scope/learningMoment.comment
  responses:
    '200':
      $ref: ../components/responses/discussionThread-item.yaml
    default:
      $ref: ../components/responses/problem.yaml
  requestBody:
    description: Common fields for discussion threads.
    content:
      application/json:
        schema:
          type: object
          properties:
            open:
              type: boolean
              description: Is the thread open for further comments?
          required:
            - open
parameters:
  - $ref: ../components/parameters/discussion-contextType.yaml
  - $ref: ../components/parameters/discussion-contextId.yaml
