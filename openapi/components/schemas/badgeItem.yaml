title: badge
description: A Badge item
type: object
properties:

  id:
    $ref: ./id.yaml
  createdAt:
    type: string
    format: date-time
    description: |
      The date as a RFC3339 string.
    examples:
      - 2022-08-30T10:09:09+10:00
  createdBy:
    type: object
    properties:
      id:
        $ref: ./id.yaml
      externalId:
        $ref: ./externalId.yaml
      title:
        type: [string, 'null']
        description: The user's title (Mr., Ms., etc.).
        examples:
          - Ms
      firstName:
        type: [string, 'null']
        description: |
          The user's first name.
          
          Schoolbox doesn't distinguish between a person's actual first name
          and any other names, and in any case is not the definitive source of
          naming information; therefore in practice this will usually be the
          user's given name.
        examples:
          - Rebecca

      lastName:
        type: [string, 'null']
        description: The user's surname.
        examples:
          - White
      _links:
        type: object
        properties:
          profile:
            type: string
            examples:
              - /search/user/2
          avatar:
            type: string
            examples:
              - /portrait.php?id=2&size=square64
      isDeleted:
        type: boolean
        examples:
          - false
  updatedAt:
    type: string
    format: date-time
    description: |
      The date as a RFC3339 string.
    examples:
      - 2022-08-30T10:09:09+10:00
  updatedBy:
    type: object
    properties:
      id:
        $ref: ./id.yaml
      externalId:
        $ref: ./externalId.yaml
      title:
        type: [string, 'null']
        description: The user's title (Mr., Ms., etc.).
        examples:
          - Ms
      firstName:
        type: [string, 'null']
        description: |
          The user's first name.
          
          Schoolbox doesn't distinguish between a person's actual first name
          and any other names, and in any case is not the definitive source of
          naming information; therefore in practice this will usually be the
          user's given name.
        examples:
          - Rebecca

      lastName:
        type: [string, 'null']
        description: The user's surname.
        examples:
          - White
      _links:
        type: object
        properties:
          profile:
            type: string
            examples:
              - /search/user/2
          avatar:
            type: string
            examples:
              - /portrait.php?id=2&size=square64
      isDeleted:
        type: boolean
        examples:
          - false
  name:
    type: string
    examples:
      - |
        Jump Rope for Heart Team
  body:
    type: string
    description: |
      The content of the Learning Moment
  image:
    type: [string, 'null']
  icon:
    type: string
    description: |
      The Badge Image, either system defined or selectable by the user
    examples:
      - |
        /images/badges/sport/23.svg
  allowAsGoal:
    type: boolean
    examples:
      - true
  animate:
    type: boolean
    examples:
      - true
    description: |
      On First load of the achieved badge, should the badge be animated? flying stars, fly in...
  category:
    type: object
    properties:
      id:
        type: integer
        examples:
          - 4
      name:
        type: string
        examples:
          - |
            Extra-Curricular
  achievementExpiry:
    type: [string, 'null']
    format: date-time
    description: |
      The date as a RFC3339 string.
    examples:
      - null
  goalExpiry:
    type: [string, 'null']
    format: date-time
    description: |
      The date as a RFC3339 string.
    examples:
      - null
  curriculumNodes:
    type: [array, 'null']
    items:
      $ref: ./curriculumItem.yaml
  tags:
    examples:
      - null
    type: [object, 'null']
    description: |
      System configurable in your Admin Lists Learning Moment area
    properties:
      id:
        type: integer
        description: the DB identifier of the Learning Moment Tags
        examples:
          - 1
      name:
        type: string
        description: the name of the Learning Moment type, may not be unique
        examples:
          - Class Work
  _links:
    type: object
    properties:
      update:
        type: string
        description: |
          the link for the user to update the badge
        examples:
          - /learning/badge/10/update
      delete:
        type: string
        description: |
          the link for the user to delete the badge
        examples:
          - /learning/badge/10
      achievementRecipients:
        type: string
        examples:
          - /learning/badge/award/10/achievement/recipients
      goalRecipients:
        type: string
        examples:
          - /learning/badge/award/10/goal/recipients
      achievementWithdraw:
        type: string
        examples:
          - /learning/badge/award/10/achievement/withdraw
      goalWithdraw:
        type: string
        examples:
          - /learning/badge/award/10/goal/withdraw
      icon:
        type: string
        description: |
          The Badge Image, either system defined or selectable by the user
        examples:
          - /static/images/badges/sport/23.svg