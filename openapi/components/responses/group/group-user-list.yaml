description: Information about a group, including a list of users belonging to the group.
content:
  application/json:
    schema:
      title: User list
      description: A list of users
      readOnly: true
      type: object
      properties:

        groupId:
          $ref: ../../schemas/id.yaml

        groupName:
          type: string
          description: The name of the group, followed by its class codes if it has any.

        settings:
          $ref: ../../schemas/groupSettings-read.yaml

        members:
          description: |
            Everyone with access to the group, including users on the waiting
            list. The list isn't paginated.
          type: array
          uniqueItems: true
          items:
            $ref: ../../schemas/groupMember.yaml
