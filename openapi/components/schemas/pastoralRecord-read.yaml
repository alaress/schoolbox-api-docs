title: Pastoral record (read)
description: |
  A pastoral record, as read through the API. It shows a user no more than the record page shows them:

  * `bodyPrivate` is null, and `attachmentsPrivate` and `commentsPrivate` are empty, unless the user can see
    the record's confidential content: pastoral moderators, the record's author, and users given
    General + Confidential access.
  * Comments are only included for users who may comment on the record.
  * `tags`, `recordActions` and `access` are only included for staff.
  * `externalId` values are only included for staff.
  * `severity` is only included when Allow specification of severity on pastoral records is ON, and
    `points` only when pastoral points are enabled.
readOnly: true
allOf:
  - $ref: ./pastoralRecord-base.yaml
  - type: object
    properties:
      linkedFolders:
        description: |
          Classes and groups linked to this record. A link to the folder's homepage is only given when the
          user can read the folder.
        type: array
        items:
          allOf:
            - $ref: ./pastoral-linkedFolder.yaml
            - type: object
              properties:
                isDeleted:
                  description: Whether the folder has been deleted.
                  type: boolean
                _links:
                  type: object
                  properties:
                    homepage:
                      description: The folder's homepage, if the user can read the folder.
                      type: [string, 'null']
                      format: uri-reference
      isArchived:
        description: Whether the record has expired.
        type: boolean
      expiresAt:
        description: When the record expires, if it does.
        type: [string, 'null']
        format: date-time
      access:
        description: The record's visibility rules. Only included for staff.
        type: array
        items:
          $ref: ./pastoralAccess.yaml
    required: [isArchived, expiresAt]
