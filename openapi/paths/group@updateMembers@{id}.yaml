patch:
  operationId: groupUpdateMembers
  tags: [group]
  summary: Update group members
  description: |
    Changes the access of one or more members of a group. Set `read` to
    approve a user on the waiting list. Users who aren't members of the group
    are ignored.

    #### Errors
    * 400: Only staff can be group admins is on, and a member who isn't staff
      was given `admin` access. No members are changed.

    #### Permission
    This endpoint is available for superusers and users with full access to the
    group, which includes its admins.

    This endpoint requires the following scope when authorized using a bearer
    token:
    - https://schoolbox.education/scope/group
  security:
    - session: []
    - bearerAuth:
        - https://schoolbox.education/scope/group
  requestBody:
    $ref: ../components/requestBodies/groupMember-update.yaml
  responses:
    '200':
      $ref: ../components/responses/group/groupMember-updated.yaml
    default:
      $ref: ../components/responses/problem.yaml

parameters:
  - $ref: ../components/parameters/group-id.yaml
