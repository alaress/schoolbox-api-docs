post:
  operationId: groupAddMembers
  tags: [group]
  summary: Add members to a group
  description: |
    Adds users to a group, named individually or by another group or role.
    New members get `read` access: use
    [Update group members](#patch-/group/updateMembers/-id-) to change it.

    Users who already have access to the group, including those on its
    waiting list, are skipped. If the folder isn't a group yet and users are
    added, it becomes a private group with notifications enabled.

    #### Permission
    This endpoint is available for superusers and users with full access to the
    group, which includes its admins.

    This endpoint requires the following scope when authorized using a bearer
    token:
    - https://schoolbox.education/scope/group
  security:
    - session: []
    - bearerAuth:
        - https://schoolbox.education/scope/group
  requestBody:
    $ref: ../components/requestBodies/groupMember-add.yaml
  responses:
    '200':
      $ref: ../components/responses/group/groupMember-added.yaml
    default:
      $ref: ../components/responses/problem.yaml

parameters:
  - $ref: ../components/parameters/group-id.yaml
