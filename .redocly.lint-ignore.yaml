# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
#
# These paths overlap with another documented path (`/news/{id}/delete` and
# `/calendar/event/{id}/modify` respectively), but they are existing Schoolbox
# routes, so the docs must describe them as they are.
openapi/openapi.yaml:
  no-ambiguous-paths:
    - '#/paths/~1news~1feed~1{key}'
    - '#/paths/~1calendar~1event~1attendance~1{id}'
