get:
  operationId: userGetTokenForSelf
  deprecated: true
  tags: [userToken]
  summary: Get an authentication token
  description: |
    Retrieve an authentication token for the user: deprecated in favour of the
    `POST` variant.

    This endpoint is intended so that in-browser API calls performed within
    a Schoolbox instance may be performed in a manner more in common with
    calls to a remote API.

    This endpoint will automatically assign scopes, depending on the security
    scheme used to authenticate the request:
    | Scheme | Scopes |
    |---|---|
    | `bearerAuth` | Any scope on the JWT which is still stored against its token, and is defined on the `bearerAuth` security scheme. If the JWT has no scope at all, the session scope `https://schoolbox.education/scope/session` |
    | `session` | The session scope `https://schoolbox.education/scope/session` |

    If the JWT has scopes, but none of them may be inherited, the request is
    rejected with a `403` response.

    When authorized using a bearer token, the new token expires along with the
    JWT, if that is sooner than the default expiry.

    This endpoint requires one of the following scopes when authorized using a
    bearer token:
    - https://schoolbox.education/scope/user.token
    - https://schoolbox.education/scope/session
  security:
    - session: []
    - bearerAuth:
        - https://schoolbox.education/scope/user.token
    - bearerAuth:
        - https://schoolbox.education/scope/session
  responses:
    '200':
      $ref: ../components/responses/userToken.yaml
    default:
      $ref: ../components/responses/problem.yaml

post:
  operationId: userCreateTokenForSelf
  tags: [userToken]
  summary: Create an authentication token
  description: |
    Create an authentication token for the user.

    This endpoint is intended so that in-browser API calls performed within
    a Schoolbox instance may be performed in a manner more in common with
    calls to a remote API.

    This endpoint will restrict the scopes which may be added to the new token,
    depending on the security scheme used to authenticate the request:
    | Scheme | Scopes |
    |---|---|
    | `bearerAuth` | Any scope on the JWT which is still stored against its token, plus the read-only scope matching any read+write scope on it (e.g. `https://schoolbox.education/scope/assessment` also allows `https://schoolbox.education/scope/assessment:readonly`). If the JWT has the session scope, or no scope at all, then any scope defined on the `bearerAuth` security scheme |
    | `session` | Any scope defined on the `bearerAuth` security scheme |

    The `bearerAuth` restriction applies whoever the JWT identifies, including
    superusers: a request for a scope which may not be added is rejected with a
    `403` response.

    When authorized using a bearer token, the new token may also not expire
    after the JWT: if no expiry is requested, the new token expires along with
    the JWT, and requesting a later expiry is rejected with a `400` response.

    This endpoint requires one of the following scopes when authorized using a
    bearer token:
    - https://schoolbox.education/scope/user.token
    - https://schoolbox.education/scope/session
  security:
    - session: []
    - bearerAuth:
        - https://schoolbox.education/scope/user.token
    - bearerAuth:
        - https://schoolbox.education/scope/session
  requestBody:
    $ref: ../components/requestBodies/userToken-create.yaml
  responses:
    '200':
      $ref: ../components/responses/userToken-created.yaml
    default:
      $ref: ../components/responses/problem.yaml
