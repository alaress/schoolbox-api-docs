parameters:
  - $ref: ../components/parameters/id.yaml
post:
  operationId: calendarEvent.postMove
  tags: [calendar]
  summary: Move a calendar event
  description: |
    Moves a calendar event

    This endpoint requires the following scope when authorized using a bearer
    token:
    - https://schoolbox.education/scope/calendar
  security:
    - session: []
    - bearerAuth:
        - https://schoolbox.education/scope/calendar
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            start:
              type: string
              description: |
                The new start date as a RFC3339 string. Eg. "2018-01-28T00:00:00+11:00".
              examples:
                - "2018-01-28T00:00:00+11:00"
            end:
              type: string
              description: |
                The new end date as a RFC3339 string. Eg. "2018-01-28T00:00:00+11:00".
              examples:
                - "2018-01-28T00:00:00+11:00"
            allDay:
              type: integer
              enum:
                - 0
                - 1
              examples:
                - 0
              description: Whether the event is an all day event - 1 means 'all day', 0 means 'not all day'.
  responses:
    '200':
      description: |
        Empty body
    default:
      $ref: ../components/responses/problem.yaml
