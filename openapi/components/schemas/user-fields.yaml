type: object
properties:

  externalId:
    $ref: ./externalId.yaml

  username:
    type: string
    description: |
      The user's username. This will be used as the user's identification
      when they attempt to log into the Schoolbox instance.
    examples:
      - rwhite

  superuser:
    type: boolean
    description: |
      Does this user have superuser permissions over the Schoolbox
      instance?
    default: false

  enabled:
    type: boolean
    description: |
      Legacy compatibility field; still supported. Prefer disabledAt and archivedAt for new integrations.
      In responses, true means archivedAt is null, regardless of disabledAt. This is not a login eligibility flag:
      disabled, archived or deleted users cannot log in.
      In requests, true clears both timestamps; false disables and archives the user, retaining existing dates
      and using the current time for new transitions. Boolean and numeric or form-encoded 0/1 values are accepted.
      Do not combine enabled with either timestamp field, even when null; the request will be rejected.

  disabledAt:
    type: [string, 'null']
    format: date-time
    description: |
      Disabled timestamp. A non-null value prevents login. Send null to clear this state.
      Omission preserves the existing value, including on PUT; new users default to null.
      Supply RFC3339 with seconds and an explicit timezone offset. Fractional seconds are accepted and
      discarded; instants are converted to the school's timezone for storage. A supplied date replaces the existing date.
    examples:
      - '2026-10-20T14:30:00+11:00'
      - null

  archivedAt:
    type: [string, 'null']
    format: date-time
    description: |
      Archived timestamp. A non-null value prevents login and excludes the profile from normal searches
      unless archived users are included by the search setting. Send null to clear this state.
      Omission preserves the existing value, including on PUT; new users default to null.
      Supply RFC3339 with seconds and an explicit timezone offset. Fractional seconds are accepted and
      discarded; instants are converted to the school's timezone for storage. A supplied date replaces the existing date.
    examples:
      - '2026-10-20T14:30:00+11:00'
      - null

  title:
    type: [string, 'null']
    description: The user's title (Mr., Ms., etc.).
    examples:
      - Ms

  firstName:
    type: string
    description: |
      The user's first name.

      Schoolbox doesn't distinguish between a person's actual first name
      and any other names, and in any case is not the definitive source of
      naming information; therefore in practice this will usually be the
      user's given name.
    examples:
      - Rebecca

  lastName:
    type: [string, 'null']
    description: The user's surname.
    examples:
      - White

  preferredName:
    type: [string, 'null']
    description: The user's preferred name.
  
  isEmailDerived:
    type: boolean
    description: |
      Is this user's email address derived directly from their username
      and the host name of the Schoolbox instance?

  altEmail:
    type: [string, 'null']
    format: email
    description: |
      The user's email address, if it is not derived from their username
      and hostname.
    examples:
      - rwhite@example.com.au

  positionTitle:
    type: [string, 'null']
    description: |
      The user's job or position title within the school which owns the
      Schoolbox instance.

  flags:
    type: object
    description: |
      A set of flags which control the behavior of a user's Schoolbox
      session.
    properties:
      showContacts:
        type: boolean
        description: Does this user's contacts get shown to other users?
      enableTimetable:
        type: boolean
        description: Does this user get to see their timetabled classes?
      showSideNav:
        type: boolean
        description: Does the side navigation show for this user?
      showNotificationsPanel:
        type: boolean
        description: Does the notifications panel show for this user?
      showGradeGraph:
        type: boolean
        description: Does the grade graph show for this user?
      enableEportfolio:
        type: boolean
        default: false
        description: Is this user able to create ePortfolio content?
      useInternalMail:
        type: boolean
        default: false
        description: |
          Does this user use Schoolbox's internal mail system to send
          email?

          If false, they use webmail instead.
      calendarView:
        type: string
        description: Which calendar view will the user default to?
        default: month
        enum:
          - month
          - agendaWeek
          - agendaDay
          - list
