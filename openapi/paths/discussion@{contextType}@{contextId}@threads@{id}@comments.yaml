get:
  operationId: getCommentsByThread
  tags: [discussion]
  summary: Get comments for a thread
  description: |
    This endpoint requires one of the following scopes when authorized using a
    bearer token, depending on `contextType`:
    - `comms`:
      - https://schoolbox.education/scope/news.comment
      - https://schoolbox.education/scope/news.comment:readonly
    - `evidence`:
      - https://schoolbox.education/scope/learningMoment.comment
      - https://schoolbox.education/scope/learningMoment.comment:readonly
  security:
    - session: []
    - bearerAuth:
        - https://schoolbox.education/scope/news.comment
    - bearerAuth:
        - https://schoolbox.education/scope/news.comment:readonly
    - bearerAuth:
        - https://schoolbox.education/scope/learningMoment.comment
    - bearerAuth:
        - https://schoolbox.education/scope/learningMoment.comment:readonly
  responses:
    '200':
      $ref: ../components/responses/discussionComment-list.yaml
    default:
      $ref: ../components/responses/problem.yaml

post:
  operationId: createCommentInThread
  tags: [discussion]
  summary: Create a new comment
  description: |
    This endpoint requires the following scope when authorized using a bearer
    token, depending on `contextType`:
    - `comms`:
      - https://schoolbox.education/scope/news.comment
    - `evidence`:
      - https://schoolbox.education/scope/learningMoment.comment
  security:
    - session: []
    - bearerAuth:
        - https://schoolbox.education/scope/news.comment
    - bearerAuth:
        - https://schoolbox.education/scope/learningMoment.comment
  responses:
    '200':
      $ref: ../components/responses/discussionComment-item.yaml
    default:
      $ref: ../components/responses/problem.yaml
  requestBody:
    description: A single comment.
    content:
      application/json:
        schema:
          type: object
          properties:
            content:
              description: Comment content.
              type: string
          required:
            - content
parameters:
  - $ref: ../components/parameters/discussion-contextType.yaml
  - $ref: ../components/parameters/discussion-contextId.yaml
  - $ref: ../components/parameters/id.yaml
  - $ref: ../components/parameters/cursor.yaml
