description: A single comment
content:
  application/json:
    schema:
      type: object
      properties:
        id:
          description: The ID of this comment.
          type: integer
        author:
          type: object
          properties:
            id:
              description: The ID of this user.
              type: integer
            externalId:
              $ref: ../schemas/externalId.yaml
            title:
              description: The user's title (Mr., Ms., etc.).
              type: [string, 'null']
            firstname:
              description: The user's first name.
              type: [string, 'null']
            fullName:
              description: The user's full name.
              type: [string, 'null']
            givenName:
              description: The user's given name.
              type: [string, 'null']
            lastname:
              description: The user's last name.
              type: [string, 'null']
            preferredName:
              description: The user's preferred name.
              type: [string, 'null']
            _links:
              type: object
              properties:
                avatar:
                  type: object
                  properties:
                    auth:
                      type: [boolean, 'null']
                      description: |
                        Is the currently authenticated user authorized to view the resource
                        pointed to by `href`?
                        
                        If this value is `null`, then it is not known whether the user may
                        view this resource.
                    href:
                      type: [string, 'null']
                      format: uri
                profile:
                  type: object
                  properties:
                    auth:
                      type: [boolean, 'null']
                      description: |
                        Is the currently authenticated user authorized to view the resource
                        pointed to by `href`?
                        
                        If this value is `null`, then it is not known whether the user may
                        view this resource.
                    href:
                      type: [string, 'null']
                      format: uri
        content:
          type: string
        createdAt:
          $ref: ../schemas/dateTimeString.yaml
        updatedAt:
          $ref: ../schemas/dateTimeString.yaml
        _links:
          type: object
          properties:
            delete:
              type: object
              properties:
                href:
                  type: [string, 'null']
                  format: uri
                auth:
                  type: [boolean, 'null']
                  description: |
                    Is the currently authenticated user authorized to view the resource
                    pointed to by `href`?
                    
                    If this value is `null`, then it is not known whether the user may
                    view this resource.
