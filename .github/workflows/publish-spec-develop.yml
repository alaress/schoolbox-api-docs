name: publish-spec-develop

# Publish of beta specs happens on prerelease.
# The spec is built with the release's own tooling (package.json, Redocly
# config and scripts), so master and develop releases can use different
# Redocly versions. Only the built spec and builds list go to gh-pages.
on:
  release:
    types:
      - prereleased
jobs:
  build:
    if: github.repository == 'alaress/schoolbox-api-docs'
    runs-on: ubuntu-latest
    steps:
      # Two checkouts: the release tag (spec + build tooling) into the
      # workspace root, and gh-pages (published specs) into gh-pages/
      - uses: actions/checkout@v3
      - uses: actions/checkout@v3
        with:
          ref: gh-pages
          path: gh-pages
      - uses: actions/setup-node@v3.1.0
      - name: Push to gh-pages branch
        id: publish-spec-develop
        run: |
          # Commit on behalf of the github-actions bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Start from the specs already published on gh-pages
          mkdir -p docs/builds/
          cp -r gh-pages/docs/builds/. docs/builds/

          # Build the docs with this release's tooling (do not set beta specs as the most recently selected)
          npm ci
          npm run rebuild-builds-list
          npm run build --build-version=${{ github.ref_name }}

          # Copy the new spec and builds list into gh-pages
          cp docs/builds/${{ github.ref_name }}.yaml gh-pages/docs/builds/
          cp docs/builds.json gh-pages/docs/builds.json

          # Commit and push
          cd gh-pages/
          git add -f docs/builds docs/builds.json
          git commit --allow-empty -m "Publish spec for beta release ${{ github.ref_name }}"
          git push
