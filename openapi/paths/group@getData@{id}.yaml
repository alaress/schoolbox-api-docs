get:
  operationId: groupGetUsersInGroup
  tags: [group]
  summary: Get all users belonging to a group
  description: |
    Returns the group's settings and every user with access to it, including
    users on the waiting list (`accessType` is `none`). If the folder isn't a
    group, `members` is empty.

    #### Permission
    This endpoint is available for superusers and users with full access to the
    group, which includes its admins.

    This endpoint requires one of the following scopes when authorized using a
    bearer token:
    - https://schoolbox.education/scope/group
    - https://schoolbox.education/scope/group:readonly
  security:
    - session: []
    - bearerAuth:
        - https://schoolbox.education/scope/group
    - bearerAuth:
        - https://schoolbox.education/scope/group:readonly
  responses:
    '200':
      $ref: ../components/responses/group/group-user-list.yaml
    default:
      $ref: ../components/responses/problem.yaml

parameters:
  - $ref: ../components/parameters/group-id.yaml
