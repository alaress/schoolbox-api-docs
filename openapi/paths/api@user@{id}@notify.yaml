post:
  operationId: apiusernotify.apiUserNotify
  tags: [user]
  summary: Create a user notification
  description: |
    Send an instant notification to a selected user.
    Only superusers may notify other users: non-superusers may notify only
    themselves.

    This endpoint requires the following scope when authorized using a bearer
    token:
    - https://schoolbox.education/scope/user.notification
  security:
    - session: []
    - bearerAuth:
        - https://schoolbox.education/scope/user.notification
  responses:
    '200':
      description: The notification was sent.
    default:
      $ref: ../components/responses/problem.yaml
  requestBody:
    $ref: ../components/requestBodies/userNotify.yaml

parameters:
  - $ref: ../components/parameters/id.yaml
